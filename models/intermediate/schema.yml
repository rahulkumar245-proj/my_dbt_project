version: 2

models:
  - name: int_orders_enriched
    description: "Intermediate order model that enriches order transactions with customer, product, and order status information."

    columns:
      - name: OrderID
        description: "Unique identifier for each order."
        data_tests:
          - not_null
          - unique

      - name: CustomerID
        description: "Name of the customer associated with the order."
        data_tests:
          - not_null

      - name: ProductID
        data_tests:
          - not_null

      - name: TotalAmount
        data_tests:
          - not_null

      - name: StatusCategory
        description: "Business category assigned to the order status using the order status mapping."